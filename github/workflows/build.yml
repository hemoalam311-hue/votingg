name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Assets and Capacitor
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "VotingApp" "com.voting.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VotingApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
